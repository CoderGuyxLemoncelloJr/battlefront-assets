<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Battlefront assets</title>
    <style>
        body { margin: 24px; color: #e8edf3; background: #18202b; font: 15px Arial, sans-serif; }
        h1 { font-size: 26px; }
        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        a { display: block; color: inherit; text-decoration: none; overflow-wrap: anywhere; }
        img { display: block; width: 100%; height: 180px; object-fit: contain; background: #343e4d; }
        span { display: block; padding: 8px 0; }
    </style>
</head>
<body>
    <h1>Battlefront assets</h1>
    <p>Click an image to open its full-resolution PNG.</p>
    <div id="grid"></div>
    <script src="runtime.js"></script>
    <script>
        var grid = document.getElementById("grid");
        BattlefrontPNG.assets.forEach(function(asset) {
            var link = document.createElement("a");
            var img = document.createElement("img");
            var name = document.createElement("span");
            link.href = asset.file;
            img.src = asset.file;
            img.alt = asset.name;
            img.loading = "lazy";
            name.textContent = asset.name;
            link.appendChild(img);
            link.appendChild(name);
            grid.appendChild(link);
        });
    </script>
</body>
</html>
